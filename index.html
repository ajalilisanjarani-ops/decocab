<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دکوکاب | DecoCab</title>
  <meta name="description" content="دکوکاب | طراحی و اجرای کابینت و دکوراسیون داخلی">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Vazirmatn", sans-serif;
      min-height: 100vh;
      color: #fff;
      background:
        radial-gradient(circle at 15% 20%, rgba(212,175,55,.12), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(212,175,55,.08), transparent 30%),
        #0b0b0b;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }
    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    .card {
      position: relative;
      overflow: hidden;
      padding: 48px 28px 30px;
      border-radius: 30px;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.08),
        rgba(255,255,255,.025)
      );
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(20px);
    }
    .gold-line {
      width: 65px;
      height: 3px;
      margin: 0 auto 25px;
      border-radius: 10px;
      background: linear-gradient(90deg, #8f6b18, #f3d477, #8f6b18);
    }
    .logo {
      width: 125px;
      height: 125px;
      margin: 0 auto 25px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(145deg, #f1d47a, #9c751d);
      color: #111;
      font-size: 25px;
      font-weight: 800;
      border: 5px solid rgba(255,255,255,.08);
      box-shadow:
        0 10px 35px rgba(0,0,0,.5),
        0 0 35px rgba(212,175,55,.15);
    }
    h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .english {
      direction: ltr;
      font-size: 14px;
      letter-spacing: 5px;
      color: #d5b85a;
      margin-bottom: 18px;
      text-transform: uppercase;
    }
    .description {
      color: #c9c9c9;
      font-size: 15px;
      line-height: 2;
      margin-bottom: 30px;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 14px 20px;
      border-radius: 15px;
      text-decoration: none;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.1);
      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
    }
    .button:hover {
      transform: translateY(-3px);
      background: rgba(212,175,55,.12);
      border-color: rgba(212,175,55,.5);
    }
    .button.primary {
      color: #151515;
      background: linear-gradient(
        135deg,
        #f0d477,
        #a77c20
      );
      border: none;
      box-shadow: 0 8px 25px rgba(212,175,55,.18);
    }
    .button.primary:hover {
      background: linear-gradient(
        135deg,
        #f7df88,
        #bd922c
      );
    }
    .icon {
      position: absolute;
      right: 18px;
      font-size: 20px;
    }
    .footer {
      margin-top: 30px;
      color: #777;
      font-size: 12px;
    }
    .footer span {
      color: #b99537;
    }
    @media (max-width: 480px) {
      body {
        padding: 15px;
      }
      .card {
        padding: 40px 20px 25px;
        border-radius: 25px;
      }
      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="gold-line"></div>
      <!-- لوگوی موقت؛ بعداً لوگوی واقعی دکوکاب را اینجا قرار می‌دهیم -->
      <div class="logo">
        دکوکاب
      </div>
      <h1>دکوکاب</h1>
      <div class="english">
        DECOCAB
      </div>
      <p class="description">
        طراحی و اجرای کابینت<br>
        دکوراسیون داخلی با طراحی مدرن و اختصاصی
      </p>
      <div class="buttons">
        <a class="button primary" href="#">
          <span class="icon">◎</span>
          اینستاگرام دکوکاب
        </a>
        <a class="button" href="#">
          <span class="icon">⌂</span>
          وب‌سایت دکوکاب
        </a>
        <a class="button" href="tel:">
          <span class="icon">☎</span>
          تماس با دکوکاب
        </a>
      </div>
      <div class="footer">
        طراحی شده برای <span>DecoCab</span>
      </div>
    </section>
  </main>
</body>
</html>
