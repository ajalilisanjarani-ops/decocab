<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دکوکاب | DecoCab</title>

  <meta name="description" content="دکوکاب - طراحی و اجرای کابینت و دکوراسیون داخلی">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #171717, #303030);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 40px 25px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #ffffff;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #d5d5d5;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 13px 0;
      border-radius: 14px;
      background: #fff;
      color: #222;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .footer {
      margin-top: 28px;
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      دکوکاب
    </div>

    <h1>دکوکاب</h1>

    <p class="subtitle">
      طراحی و اجرای کابینت و دکوراسیون داخلی
    </p>

    <a class="button" href="#" id="instagram">
      اینستاگرام دکوکاب
    </a>

    <a class="button" href="#" id="website">
      وب‌سایت دکوکاب
    </a>

    <a class="button" href="tel:">
      تماس با دکوکاب
    </a>

    <div class="footer">
      © DecoCab
    </div>

  </div>

</body>
</html>
